name: foodiq
description: "FoodIQ - Smart Ethiopian Calorie Tracking with AI"
publish_to: 'none'
version: 1.7.0+9

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  http: ^1.2.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  path_provider: ^2.1.3
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0
  google_generative_ai: ^0.4.7
  shimmer: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  app_links: 6.1.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "foodiq_icon.png"
  adaptive_icon_background: "#FF6B35"
  adaptive_icon_foreground: "foodiq_icon.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
